{% include "header.html" %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog Detail Page</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">
  <!-- Container -->
  <div class="max-w-4xl mx-auto px-6 py-10">
    
    <!-- Blog Title -->
    <h1 class="text-4xl font-bold text-gray-900 leading-tight mb-6">
      {{data.blog_title}}
    </h1>

    <!-- Blog Image -->
    <div class="mb-8">
      <img src="/media/{{data.blog_img}}"
           alt="Blog Image"
           class="rounded-2xl shadow-lg w-full object-cover">
    </div>

    <!-- Blog Meta -->
    <div class="flex items-center gap-4 mb-6">
      <div>
        <p class="text-sm text-gray-500">Published on {% now "F d, Y" %} </p>
      </div>
    </div>

    <div class="prose max-w-none text-lg leading-relaxed">
       {{ data.blog_description|linebreaks }}
    </div>


    <!-- Back Button -->
    <div class="mt-10">
      <a href="/blog" 
         class="px-6 py-3 bg-yellow-400 text-black font-semibold rounded-full shadow-md hover:bg-yellow-300 transition">
        ← Back to Blogs
      </a>
    </div>
  </div>
  {% if messages %}
        {% for message in messages %}
        <script>
            alert("{{ message }}");
        </script>
        {% endfor %}
    {% endif %}
</body>
</html>

{% include "footer.html" %}
