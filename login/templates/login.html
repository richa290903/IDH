{% load static %}
<script src="https://cdn.tailwindcss.com"></script>
<section class="h-full bg-slate-300 py-20 ">
  <div class="flex flex-col items-center justify-center px-6 py-12 mx-auto  lg:py-0 ">
      <a href="#" class="flex items-center mb-6 text-2xl font-semibold text-gray-900 text-black">
           <img src="{% static 'Interact-removebg-preview.png' %}" alt="logo" class="h-16 w-16">&nbsp;&nbsp;
          Intract Design Hub
      </a>
      <div class="w-full bg-white rounded-lg shadow-black shadow-xl dark:border md:mt-0 sm:max-w-md xl:p-0 dark:bg-white-800 dark:border-gray-700">
          <div class="p-6 space-y-4 md:space-y-6 sm:p-8">
              <h1 class="text-xl font-bold leading-tight tracking-tight text-black md:text-2xl dark:text-white">
                  Login
              </h1>
              <span class="text-xl font-bold"> Welcome to Intract Design Hub </span>
              <form class="space-y-4 md:space-y-6" method="POST" autocomplete="off" action="../login_register/">
                {% csrf_token %}
                  <div>
                    <label class="block mb-2 text-lg font-normal">Your Email</label>
                    <input type="email" name="email" class="bg-white w-full block border border-gray-300 text-black rounded-lg  dark:placeholder-gray-400 p-2.5" placeholder="name123@company.com" required>
                  </div>
                  <div>
                    <label class="block mb-2 text-lg font-normal">Password</label>
                    <input type="password" name="password"  placeholder="••••••••" class="bg-white w-full block border border-gray-300 text-black rounded-lg  dark:placeholder-gray-400 p-2.5" required>
                  </div>

                  <div class="flex items-center justify-between">
                    <div class="flex items-start">
                        <div class="flex items-center h-5">
                          <input id="remember" aria-describedby="remember" type="checkbox" class="w-4 h-4 border border-gray-300 rounded bg-gray-50 focus:ring-3 focus:ring-primary-300 dark:bg-gray-700 dark:border-gray-600 dark:focus:ring-primary-600 dark:ring-offset-gray-800" required>
                        </div>
                        <div class="ml-3 text-sm">
                          <label for="remember" class="">Remember me</label>
                        </div>
                    </div>
                    <a href="/forgot_password" class="text-sm font-medium text-blue-600 hover:underline dark:text-primary-500">Forgot password?</a>
                </div>
                  <button type="submit" class="w-full text-white bg-[#016EEB] hover:bg-[#016EEB] focus:ring-4 focus:outline-none focus:ring-[#016EEB] font-semibold rounded-lg text-md px-5 py-2.5 text-center dark:bg-[#016EEB] dark:hover:bg-[#016EEB] dark:focus:ring-[#016EEB]">Login</button>

                  <p class="text-sm font-normal text-black">
                    Don’t have an account yet? <a href="/registration_form" class="font-medium text-primary-600 hover:underline text-blue-600">Registration</a>
                </p>
              </form>
          </div>
      </div>
  </div>
  {% if messages %}
        {% for message in messages %}
        <script>
            alert("{{ message }}");
        </script>
        {% endfor %}
    {% endif %}
</section>
